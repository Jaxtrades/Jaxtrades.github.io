<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%234F6552%22/><text x=%2250%22 y=%2268%22 text-anchor=%22middle%22 font-family=%22Georgia%22 font-size=%2252%22 fill=%22%23F6F1E9%22>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Cozy Collectives</title>
</head>
<body>
<div id="site-header"></div>

<main class="wrap" id="pdp"></main>

<div class="sticky-atc" id="sticky-atc" aria-hidden="true"></div>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const p = getProduct(params.get("id")) || PRODUCTS[0];
  const d = PRODUCT_DETAILS;
  const onSale = p.compareAt && p.compareAt > p.price;
  const shots = p.images.length ? p.images.map((_, i) => i) : [0];
  let qty = 1;

  document.title = p.name + " | Cozy Collectives";

  const specs = d.specs.map(([k, v]) => {
    if (k === "Weight" && p.weight) v = p.weight;
    if (k === "Size" && p.size) v = p.size;
    return `<tr><td>${k}</td><td>${v}</td></tr>`;
  }).join("");

  document.getElementById("pdp").innerHTML = `
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">All pals</a> / ${p.name}</nav>
    <div class="pdp">
      <div class="gallery">
        <div class="gallery-main" id="main-img">${productMedia(p, 0)}</div>
        <div class="thumbs">
          ${shots.map(i => `<button data-shot="${i}" aria-label="Show image ${i + 1}" aria-current="${i === 0}">${productMedia(p, i)}</button>`).join("")}
        </div>
      </div>

      <div class="pdp-info">
        <div class="eyebrow">Weighted plush</div>
        <h1>${p.name}</h1>
        <div class="pdp-price">
          <span class="price">${formatPrice(p.price)}</span>
          ${onSale ? `<span class="compare">${formatPrice(p.compareAt)}</span><span class="badge sale" style="position:static">Save ${formatPrice(p.compareAt - p.price)}</span>` : ""}
        </div>
        <p class="pdp-instal">or ${STORE.instalments} interest-free payments of <b>${formatPrice(p.price / STORE.instalments)}</b></p>
        <p class="pdp-tagline">${p.tagline}</p>

        <div class="opt-label">Choose your pal: <span>${p.animal}</span></div>
        <div class="pal-picker">
          ${PRODUCTS.map(o => `<a href="product.html?id=${o.id}"${o.id === p.id ? ' aria-current="page"' : ""}><span class="pick-img">${productMedia(o)}</span>${o.animal}</a>`).join("")}
        </div>

        <div class="opt-label">Quantity</div>
        <div class="buy-row">
          <div class="stepper">
            <button id="q-minus" aria-label="Decrease quantity">${ICON.minus}</button>
            <span id="q-val" aria-live="polite">1</span>
            <button id="q-plus" aria-label="Increase quantity">${ICON.plus}</button>
          </div>
          <button class="btn dark" id="add-btn">Add to cart</button>
        </div>
        <button class="btn block" id="buy-now">Buy it now</button>

        <ul class="perks">
          <li>${ICON.truck} Free shipping on orders over $${STORE.freeShippingThreshold}</li>
          <li>${ICON.lock} Secure checkout</li>
        </ul>

        <div class="acc">
          <details open><summary>Description</summary><div class="acc-body"><p style="margin-top:0">${d.description}</p><ul>${d.features.map(f => `<li>${f}</li>`).join("")}</ul></div></details>
          <details><summary>Specifications</summary><div class="acc-body"><table class="spec">${specs}</table></div></details>
          <details><summary>Care</summary><div class="acc-body">${d.care}</div></details>
          <details><summary>Shipping &amp; returns</summary><div class="acc-body">${d.shipping}</div></details>
        </div>
      </div>
    </div>`;

  document.getElementById("sticky-atc").innerHTML = `
    <div class="wrap">
      <div><div class="s-name">${p.name}</div><div>${formatPrice(p.price)}</div></div>
      <button class="btn dark" id="sticky-add">Add to cart</button>
    </div>`;

  const setQty = n => { qty = Math.max(1, n); document.getElementById("q-val").textContent = qty; };
  document.getElementById("q-minus").onclick = () => setQty(qty - 1);
  document.getElementById("q-plus").onclick = () => setQty(qty + 1);
  document.getElementById("add-btn").onclick = () => { addToCart(p.id, qty); openCart(); };
  document.getElementById("sticky-add").onclick = () => { addToCart(p.id, qty); openCart(); };
  document.getElementById("buy-now").onclick = () => { addToCart(p.id, qty); location.href = "checkout.html"; };

  document.querySelector(".thumbs").addEventListener("click", e => {
    const b = e.target.closest("[data-shot]");
    if (!b) return;
    document.getElementById("main-img").innerHTML = productMedia(p, Number(b.dataset.shot));
    document.querySelectorAll(".thumbs button").forEach(t => t.setAttribute("aria-current", t === b));
  });

  // Sticky add-to-cart bar appears once the main button scrolls out of view.
  const sticky = document.getElementById("sticky-atc");
  new IntersectionObserver(([entry]) => {
    const show = !entry.isIntersecting && entry.boundingClientRect.top < 0;
    sticky.classList.toggle("show", show);
    sticky.setAttribute("aria-hidden", !show);
  }).observe(document.getElementById("add-btn"));
</script>
</body>
</html>
