<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%234F6552%22/><text x=%2250%22 y=%2268%22 text-anchor=%22middle%22 font-family=%22Georgia%22 font-size=%2252%22 fill=%22%23F6F1E9%22>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Your cart | Cozy Collectives</title>
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <h1 class="page-title">Your cart</h1>
  <div id="cart-page"></div>
</main>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script>
  // Full-page view of the same cart the drawer shows; re-renders whenever the cart changes.
  function renderCartPage() {
    const el = document.getElementById("cart-page");
    const lines = getCartLines();
    if (!lines.length) {
      el.innerHTML = `<div class="empty"><p>Your cart is empty.</p><a href="shop.html" class="btn">Shop the pals</a></div>`;
      return;
    }
    const subtotal = cartSubtotal();
    el.innerHTML = `
      <div class="cart-page">
        <div>
          <div class="ship-bar">${shipBarHtml(subtotal)}</div>
          ${lines.map(lineHtml).join("")}
          ${upsellHtml(lines)}
        </div>
        <div class="panel">
          <div class="sum-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
          <div class="sum-row"><span>Shipping</span><span>${shippingFor(subtotal) ? formatPrice(shippingFor(subtotal)) : "Free"}</span></div>
          <div class="sum-row total" style="border-top:1px solid var(--line);padding-top:12px;margin-top:6px"><span>Total</span><span>${formatPrice(subtotal + shippingFor(subtotal))} ${STORE.currency}</span></div>
          <p class="fine">Taxes included.</p>
          <a href="checkout.html" class="btn block checkout-btn">${ICON.lock} Checkout</a>
          <p class="instal">or ${STORE.instalments} interest-free payments of <b>${formatPrice((subtotal + shippingFor(subtotal)) / STORE.instalments)}</b></p>
          <a href="shop.html" class="view-cart">Continue shopping</a>
        </div>
      </div>`;
  }

  const baseRender = renderCart;
  renderCart = function () { baseRender(); renderCartPage(); };
</script>
</body>
</html>
