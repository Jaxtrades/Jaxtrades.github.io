<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%234F6552%22/><text x=%2250%22 y=%2268%22 text-anchor=%22middle%22 font-family=%22Georgia%22 font-size=%2252%22 fill=%22%23F6F1E9%22>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Checkout | Cozy Collectives</title>
</head>
<body>
<div id="site-header"></div>

<main class="wrap" id="checkout"></main>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script>
  const main = document.getElementById("checkout");
  const lines = getCartLines();

  if (!lines.length) {
    main.innerHTML = `<div class="empty"><h1 class="page-title">Checkout</h1><p>Your cart is empty.</p><a href="shop.html" class="btn">Shop the pals</a></div>`;
  } else {
    const subtotal = cartSubtotal();
    const shipping = shippingFor(subtotal);
    const total = subtotal + shipping;
    const note = getNote();

    main.innerHTML = `
      <h1 class="page-title">Checkout</h1>
      <div class="checkout-grid">
        <form class="checkout-form" id="checkout-form">
          <h2>Contact</h2>
          <label>Email<input type="email" name="email" autocomplete="email" required></label>
          <h2>Delivery</h2>
          <label>Full name<input type="text" name="name" autocomplete="name" required></label>
          <label>Address<input type="text" name="address" autocomplete="street-address" required></label>
          <div class="form-row">
            <label>Suburb<input type="text" name="city" autocomplete="address-level2" required></label>
            <label>State
              <select name="state" autocomplete="address-level1" required>
                <option value="">Select</option><option>ACT</option><option>NSW</option><option>NT</option><option>QLD</option><option>SA</option><option>TAS</option><option>VIC</option><option>WA</option>
              </select>
            </label>
            <label>Postcode<input type="text" name="zip" inputmode="numeric" autocomplete="postal-code" required></label>
          </div>
          <label>Phone<input type="tel" name="phone" autocomplete="tel"></label>
          <h2>Payment</h2>
          <label>Payment method
            <select name="payment"><option>Credit / debit card</option><option>PayPal</option><option>Afterpay</option></select>
          </label>
          <p class="notice">Demo checkout: no payment is taken. Connect a payment provider (Shopify, Stripe Checkout or PayPal) before going live.</p>
          <button type="submit" class="btn block checkout-btn">${ICON.lock} Pay ${formatPrice(total)}</button>
        </form>

        <div class="panel">
          ${lines.map(l => `
            <div class="summary-line">
              <div class="line-img">${productMedia(l.product)}<span class="qty-badge">${l.qty}</span></div>
              <span>${l.product.name}</span>
              <span>${formatPrice(l.lineTotal)}</span>
            </div>`).join("")}
          ${note ? `<p class="fine" style="margin:8px 0">Gift note: “${note.replace(/</g, "&lt;")}”</p>` : ""}
          <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px">
            <div class="sum-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
            <div class="sum-row"><span>Shipping</span><span>${shipping ? formatPrice(shipping) : "Free"}</span></div>
            <div class="sum-row total"><span>Total</span><span>${formatPrice(total)} ${STORE.currency}</span></div>
            <p class="fine">Including GST</p>
          </div>
        </div>
      </div>`;

    document.getElementById("checkout-form").addEventListener("submit", e => {
      e.preventDefault();
      const first = e.target.name.value.trim().split(" ")[0] || "friend";
      const order = "CC" + Math.floor(100000 + Math.random() * 900000);
      clearCart();
      main.innerHTML = `
        <div class="confirm">
          <div class="eyebrow">Order ${order}</div>
          <h1>Thank you, ${first.replace(/</g, "&lt;")}!</h1>
          <p>Your pal is getting ready for the trip. A confirmation would be sent to your email here.</p>
          <a href="index.html" class="btn">Back to home</a>
        </div>`;
      window.scrollTo(0, 0);
    });
  }
</script>
</body>
</html>
